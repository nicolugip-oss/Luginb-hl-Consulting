# Temporär: ersetzt Hero-Video und Hintergrundbild durch die optimierten
# Versionen. Nach erfolgreichem Lauf wird diese Datei wieder entfernt.
name: asset-bridge
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optimised assets
        run: |
          curl -fSL -o assets/hero-scrub.mp4 "https://d2ol7oe51mr4n9.cloudfront.net/user_3IOtLc6bAOdqJ4HlFpVi3zN0omH/75dd734e-82f9-413b-b20f-9bd5e74a0c82.mp4"
          curl -fSL -o assets/bg-ambient.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IOtLc6bAOdqJ4HlFpVi3zN0omH/85343fa2-a498-4495-9dee-2a8ac8f73ff7.jpg"
          ls -la assets
      - name: Commit
        run: |
          git config user.name "asset-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add assets
          git commit -m "Optimised hero video (denser keyframes) and pre-blurred background"
          git push
