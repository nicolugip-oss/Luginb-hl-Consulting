# Temporärer Workflow: holt die generierten Hero-Assets aus der
# Higgsfield-Medienbibliothek ins Repo (der Claude-Container darf die
# CDN-Domain nicht direkt laden). Nach erfolgreichem Lauf kann diese
# Datei gelöscht werden.
name: asset-bridge
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch hero assets
        run: |
          mkdir -p assets
          curl -fSL -o assets/hero-scrub.mp4 "https://d2ol7oe51mr4n9.cloudfront.net/user_3IOtLc6bAOdqJ4HlFpVi3zN0omH/81abe3f3-c02a-48ee-aa8a-ad7a3aa3af31.mp4"
          curl -fSL -o assets/hero-poster.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IOtLc6bAOdqJ4HlFpVi3zN0omH/beaf584c-6714-4075-9239-d3b23279c9c2.jpg"
          curl -fSL -o assets/hero-ending.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IOtLc6bAOdqJ4HlFpVi3zN0omH/66b68114-6240-455b-a6c3-fc7271dc4ffd.jpg"
          ls -la assets
      - name: Commit
        run: |
          git config user.name "asset-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add assets
          git commit -m "Add hero assets (scrub video, poster, ending frame)"
          git push

# nudge: re-register workflow
