# Temporärer Workflow: holt zwei neue Bilder aus der Higgsfield-Medienbibliothek.
# Nach erfolgreichem Lauf wird diese Datei wieder entfernt.
name: asset-bridge
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fSL -o assets/bg-ambient.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IOtLc6bAOdqJ4HlFpVi3zN0omH/edd861a5-af62-4da7-ba98-647d6c1d4c55.jpg"
          curl -fSL -o assets/flow-diagram.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IOtLc6bAOdqJ4HlFpVi3zN0omH/7ef451a2-befd-4ef0-b9ad-d0aa6d5e56ee.jpg"
          ls -la assets
      - name: Commit
        run: |
          git config user.name "asset-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add assets
          git commit -m "Add ambient background and flow diagram stills"
          git push
